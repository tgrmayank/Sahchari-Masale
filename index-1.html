<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TGR POS</title>
<style>
:root{--bg:#f3f5f8;--c:#fff;--t:#0f1b2d;--m:#66758a;--b:#dde3ea;--a:#0e8f6e;--r:#d6453d;--w:#d98c1f}
[data-t=dark]{--bg:#0b121c;--c:#142030;--t:#e8eef6;--m:#8b9bb0;--b:#233349}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.b{padding:9px 14px;border:1px solid var(--b);border-radius:8px;background:var(--c);cursor:pointer;transition:transform .1s}.b:active{transform:scale(.96)}
.p{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}.d{color:var(--r)}.sm{padding:4px 8px;font-size:12px}
#app{display:flex;min-height:100vh}nav{width:210px;background:#0f1b2d;color:#c9d4e3;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font-size:20px;margin:4px 8px 0;color:#fff;letter-spacing:.5px}nav small{display:block;margin:0 8px 14px;color:#7f93ad;font-size:11px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:inherit;cursor:pointer;margin-bottom:2px}nav a:hover{background:#1b2c44}nav a.on{background:var(--a);color:#fff}
main{flex:1;padding:18px;min-width:0}.top{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.top h2{margin:0;flex:1;font-size:22px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.kp b{display:block;font-size:20px;margin-top:2px}.kp span{color:var(--m);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--b);font-size:13px}th{color:var(--m);font-weight:600}.sc{overflow-x:auto}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:60vh;overflow:auto;margin-top:10px}
.pr{border:1px solid var(--b);border-radius:10px;padding:10px;cursor:pointer;background:var(--c);text-align:left}.pr:hover{border-color:var(--a)}.pr small{color:var(--m)}
.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;animation:f .15s}.box{background:var(--c);border-radius:14px;padding:18px;width:100%;max-height:92vh;overflow:auto;animation:u .2s}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(14px);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}label{font-size:12px;color:var(--m)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.tag{padding:2px 8px;border-radius:99px;font-size:11px;background:#0e8f6e22;color:var(--a)}.tag.x{background:#d6453d22;color:var(--r)}.tag.y{background:#d98c1f22;color:var(--w)}
#toast{position:fixed;right:14px;top:14px;z-index:99}#toast div{background:#0f1b2d;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:6px;animation:u .2s;border-left:4px solid var(--a)}#toast .e{border-color:var(--r)}
.tot{font-size:26px;font-weight:700}.ln{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--b)}.ln input{width:60px;padding:4px}
#lg{max-width:340px;margin:12vh auto;padding:16px}.emp{text-align:center;color:var(--m);padding:26px}
.inv{font:12px monospace;background:#fff;color:#000;padding:12px;width:100%;max-width:300px;margin:auto}.inv table td,.inv table th{font-size:11px;padding:2px;color:#000;border:0}
@media(max-width:800px){nav{position:fixed;bottom:0;top:auto;width:100%;height:auto;display:flex;overflow-x:auto;z-index:20;padding:4px}nav h1,nav small{display:none}nav a{white-space:nowrap;font-size:12px}main{padding:12px 12px 70px}.two,.pos{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.inv,.inv *{visibility:visible}.inv{position:absolute;left:0;top:0;max-width:80mm}}
</style></head><body><div id="toast"></div><div id="root"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),F=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=n=>Math.round((+n||0)*100)/100,now=()=>new Date().toISOString(),dt=d=>new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
let D;try{D=JSON.parse(localStorage.getItem('tgr'))}catch(e){}
D=D||{products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[],moves:[],held:[],audit:[],users:[],seq:0,set:{name:'My Store',gstin:'',addr:'',phone:'',state:'',theme:'light',accent:'#0e8f6e',incl:true,upi:'',foot:'Thank you! Visit again.'}};
const save=()=>{try{localStorage.setItem('tgr',JSON.stringify(D))}catch(e){T('Storage full — export a backup',1)}};
const T=(t,e)=>{const d=document.createElement('div');d.textContent=t;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3000);return false};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tgr'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const log=a=>{D.audit.unshift({t:now(),u:U?.name,a});D.audit=D.audit.slice(0,300)};
const M=(h,w)=>{const m=document.createElement('div');m.className='mod';m.innerHTML=`<div class=box style="max-width:${w||520}px">${h}</div>`;m.onmousedown=e=>{if(e.target==m)m.remove()};document.body.append(m);return m};
const FORM=(title,fs,cb,v={})=>{const m=M(`<h3>${title}</h3><div class=grid>${fs.map(f=>`<label>${f[1]}${f[2]=='select'?`<select id=f_${f[0]}>${f[3].map(o=>`<option>${E(o)}</option>`).join('')}</select>`:`<input id=f_${f[0]} type=${f[2]||'text'} step=any value="${E(v[f[0]]??'')}">`}</label>`).join('')}</div><div class=row><button class=b onclick="this.closest('.mod').remove()">Cancel</button><button class="b p" id=ok>Save</button></div>`);
fs.forEach(f=>f[2]=='select'&&(m.querySelector('#f_'+f[0]).value=v[f[0]]??f[3][0]));
m.querySelector('#ok').onclick=()=>{const o={};fs.forEach(f=>{const x=m.querySelector('#f_'+f[0]).value;o[f[0]]=f[2]=='number'?+x||0:x.trim()});if(cb(o)!==false){m.remove();save();go()}}};
const CONF=(t,cb)=>{const m=M(`<p>${t}</p><div class=row><button class=b onclick="this.closest('.mod').remove()">No</button><button class="b p" id=y>Yes</button></div>`,360);m.querySelector('#y').onclick=()=>{m.remove();cb()}};
// EAN-13
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],PA=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const ck=d=>(10-d.split('').reduce((s,x,i)=>s+ +x*(i%2?3:1),0)%10)%10;
const ean=()=>{let b;do{b='200'+String(Math.floor(Math.random()*1e9)).padStart(9,'0');b+=ck(b)}while(D.products.some(p=>p.bc==b));return b};
const bar=c=>{if(!/^\d{13}$/.test(c))return `<div style="font:12px monospace">${E(c)}</div>`;let b='101',p=PA[c[0]];for(let i=1;i<7;i++){const l=L[c[i]];b+=p[i-1]=='L'?l:[...l].reverse().map(x=>x^1).join('')}b+='01010';for(let i=7;i<13;i++)b+=[...L[c[i]]].map(x=>x^1).join('');b+='101';
return `<svg viewBox="0 0 ${b.length+14} 52" width=170 xmlns="http://www.w3.org/2000/svg"><rect width=100% height=100% fill=#fff />${[...b].map((x,i)=>x=='1'?`<rect x=${i+7} y=2 width=1 height=40 fill=#000 />`:'').join('')}<text x=50% y=50 font-size=8 text-anchor=middle font-family=monospace>${c}</text></svg>`};
const loadZX=()=>window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});
const zxDec=cv=>new ZXing.MultiFormatReader().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText();
const decodeImg=async f=>{try{if('BarcodeDetector'in window){const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r.length)return r[0].rawValue}await loadZX();const img=new Image();img.src=URL.createObjectURL(f);await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return zxDec(c)}catch(e){return null}};
const scan=cb=>{const m=M(`<h3>Scan barcode</h3><p style="color:var(--m);font-size:12px">The camera is used only to read barcodes. If it is blocked, use the photo or manual options below.</p><video id=v autoplay playsinline muted style="width:100%;border-radius:8px;display:none;background:#000"></video><div id=se style="color:var(--r);font-size:12px;margin:6px 0"></div><div class=grid style="grid-template-columns:1fr auto"><input id=mc placeholder="Type barcode manually" inputmode=numeric><button class="b p" id=mu>Use</button></div><div class=row style="justify-content:flex-start"><button class=b id=ph>Take / choose photo</button><button class=b id=cl>Close</button></div>`,420);
const se=m.querySelector('#se');let on=1,s;const stop=()=>{on=0;s&&s.getTracks().forEach(t=>t.stop());m.remove()},done=c=>{stop();beep();cb(c)};
m.onmousedown=e=>e.target==m&&stop();m.querySelector('#cl').onclick=stop;m.querySelector('#mu').onclick=()=>{const c=m.querySelector('#mc').value.trim();c&&done(c)};m.querySelector('#mc').onkeydown=e=>e.key=='Enter'&&m.querySelector('#mu').click();
m.querySelector('#ph').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.onchange=async()=>{se.textContent='Reading photo…';const c=await decodeImg(i.files[0]);c?done(c):se.textContent='No barcode found in that photo. Try a closer, sharper shot, or type it.'};i.click()};
if(!navigator.mediaDevices?.getUserMedia){se.textContent='Live camera needs https:// or localhost — it does not work on a file opened from storage. Use the photo option or type the code.';return}
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(async st=>{s=st;if(!on)return stop();const v=m.querySelector('#v');v.srcObject=st;v.style.display='block';await v.play().catch(()=>{});
let det=null;if('BarcodeDetector'in window)det=new BarcodeDetector();else{try{await loadZX()}catch(e){se.textContent='Live scan needs internet once to load the decoder. Use the photo option or type the code.';return}}
const cv=document.createElement('canvas');
while(on){try{let c;if(det){const r=await det.detect(v);c=r[0]?.rawValue}else if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);c=zxDec(cv)}if(c){done(c);return}}catch(e){}await new Promise(r=>setTimeout(r,200))}})
.catch(e=>{se.textContent=e.name=='NotAllowedError'?'Camera is blocked. Tap the lock/camera icon in the address bar, allow Camera, then reopen this. Or use the photo option / type the code.':e.name=='NotFoundError'?'No camera found on this device. Use a USB scanner or type the code.':'Camera error: '+e.message})};
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=900;o.start();o.stop(a.currentTime+.08)}catch(e){}};
// Auth
let U=null,pg='dash',cart=[],cd={t:'%',v:0},cu='',q='';
const PERM={admin:['dash','pos','inv','pur','sales','cust','sup','exp','rep','set'],manager:['dash','pos','inv','pur','sales','cust','sup','exp','rep'],cashier:['pos','sales','cust']};
const NAV={dash:'Dashboard',pos:'Billing',inv:'Inventory',pur:'Purchases',sales:'Sales',cust:'Customers',sup:'Suppliers',exp:'Expenses',rep:'Reports',set:'Settings'};
const can=p=>PERM[U.role].includes(p),isM=()=>U.role!='cashier';
async function boot(){document.documentElement.dataset.t=D.set.theme;document.documentElement.style.setProperty('--a',D.set.accent);
if(!D.users.length){D.users.push({id:uid(),name:'Admin',role:'admin',h:await sha('1234')});save()}
$('#root').innerHTML=`<div class=card id=lg><h2 style="margin:0">TGR POS</h2><small style="color:var(--m)">SMART BILLING. SMART BUSINESS.</small><div class=grid style="grid-template-columns:1fr"><label>User<select id=lu>${D.users.map(u=>`<option value=${u.id}>${E(u.name)} (${u.role})</option>`).join('')}</select></label><label>PIN<input id=lp type=password inputmode=numeric></label></div><button class="b p" style="width:100%" id=li>Sign in</button><p style="color:var(--m);font-size:12px">First run: Admin / PIN 1234 — change it in Settings.</p></div>`;
const tries=JSON.parse(sessionStorage.tr||'{"n":0,"u":0}');
$('#li').onclick=async()=>{if(Date.now()<tries.u)return T('Too many attempts. Wait a minute.',1);const u=D.users.find(x=>x.id==$('#lu').value);if(u&&u.h==await sha($('#lp').value)){U=u;D.users.forEach(x=>x);D.audit.unshift({t:now(),u:u.name,a:'Login'});save();sessionStorage.tr='{"n":0,"u":0}';idle();go()}else{tries.n++;if(tries.n>=5){tries.u=Date.now()+6e4;tries.n=0}sessionStorage.tr=JSON.stringify(tries);T('Wrong PIN',1)}};
$('#lp').onkeydown=e=>e.key=='Enter'&&$('#li').click()}
let it;const idle=()=>{clearTimeout(it);it=setTimeout(()=>{U=null;boot()},15*6e4)};['click','keydown'].forEach(e=>addEventListener(e,()=>U&&idle()));
function go(p){if(p)pg=p;if(!can(pg))pg='pos';$('#root').innerHTML=`<div id=app><nav><h1>TGR POS</h1><small>${E(D.set.name)} · ${E(U.name)}</small>${PERM[U.role].map(k=>`<a class="${k==pg?'on':''}" onclick="go('${k}')">${NAV[k]}</a>`).join('')}<a onclick="theme()">Theme</a><a onclick="U=null;boot()">Logout</a></nav><main>${V[pg]()}</main></div>`;if(pg=='pos')posInit()}
const theme=()=>{D.set.theme=D.set.theme=='dark'?'light':'dark';document.documentElement.dataset.t=D.set.theme;save()};
const tb=(h,rows,empty)=>rows.length?`<div class=sc><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div class=emp>${empty||'Nothing here yet.'}</div>`;
const inP=(d,p)=>{const x=new Date(d),n=new Date();if(p=='all')return 1;if(p=='today')return x.toDateString()==n.toDateString();if(p=='week')return n-x<7*864e5;if(p=='month')return x.getMonth()==n.getMonth()&&x.getFullYear()==n.getFullYear();return x.getFullYear()==n.getFullYear()};
const live=p=>D.sales.filter(s=>s.status!='cancelled'&&inP(s.date,p));
const profit=s=>s.items.reduce((a,i)=>a+(i.taxable/i.qty-i.cost)*(i.qty-i.rq),0);
const rev=s=>s.total-s.refunded;
const dl=(n,txt,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:m||'text/csv'}));a.download=n;a.click()};
const csv=rows=>rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
// Views
const V={};
V.dash=()=>{const t=live('today'),mo=live('month'),ex=D.expenses.filter(e=>inP(e.date,'today')).reduce((a,e)=>a+e.amt,0),low=D.products.filter(p=>p.stock<=p.min),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString('en-IN',{weekday:'short'}),v:D.sales.filter(s=>s.status!='cancelled'&&new Date(s.date).toDateString()==d.toDateString()).reduce((a,s)=>a+rev(s),0)}}),mx=Math.max(1,...days.map(d=>d.v)),
top={};live('month').forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty-i.rq));
return `<div class=top><h2>Dashboard</h2></div><div class=kp>${[['Today sales',F(t.reduce((a,s)=>a+rev(s),0))],['Today profit',F(t.reduce((a,s)=>a+profit(s),0))],['Orders today',t.length],['Today expenses',F(ex)],['Month revenue',F(mo.reduce((a,s)=>a+rev(s),0))],['Month profit',F(mo.reduce((a,s)=>a+profit(s),0))],['Products',D.products.length],['Customers',D.customers.length],['Suppliers',D.suppliers.length],['Low stock',low.length],['Out of stock',D.products.filter(p=>p.stock<=0).length],['Pending dues',F(D.customers.reduce((a,c)=>a+c.due,0))]].map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
<div class=two><div class=card><b>Last 7 days</b><svg viewBox="0 0 350 130" width=100%>${days.map((d,i)=>`<rect x=${i*50+8} y=${110-d.v/mx*95} width=34 height=${d.v/mx*95} rx=4 fill=var(--a) /><text x=${i*50+25} y=125 font-size=10 text-anchor=middle fill=var(--m)>${d.l}</text>`).join('')}</svg></div>
<div class=card><b>Top sellers (month)</b>${tb(['Product','Qty'],Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>[E(x[0]),x[1]]),'No sales yet.')}</div></div>
<div class=two><div class=card><b>Recent transactions</b>${tb(['Invoice','Total','Status'],D.sales.slice(0,6).map(s=>[s.no,F(s.total),`<span class=tag>${s.status}</span>`]),'Make your first sale in Billing.')}</div><div class=card><b>Low stock</b>${tb(['Product','Stock'],low.slice(0,6).map(p=>[E(p.name),p.stock]),'All stocked up.')}</div></div>`};
V.inv=()=>{const l=D.products.filter(p=>(p.name+p.sku+p.bc+p.cat).toLowerCase().includes(q.toLowerCase()));
return `<div class=top><h2>Inventory</h2><input style="max-width:200px" placeholder="Search" value="${E(q)}" oninput="q=this.value;go();document.querySelector('main input').focus()"><button class="b p" onclick="A.prod()">Add product</button><button class=b onclick="A.imp()">Import CSV</button><button class=b onclick="A.exp()">Export CSV</button><button class=b onclick="A.labels()">Print labels</button></div><div class=card>${tb(['Product','SKU / Barcode','Cost','Price','GST','Stock',''],l.map(p=>[E(p.name)+`<br><small>${E(p.cat)}</small>`,E(p.sku)+'<br><small>'+E(p.bc)+'</small>',F(p.cost),F(p.price),p.gst+'%',`<span class="tag ${p.stock<=0?'x':p.stock<=p.min?'y':''}">${p.stock} ${E(p.unit)}</span>`,`<button class="b sm" onclick="A.prod('${p.id}')">Edit</button> <button class="b sm" onclick="A.adj('${p.id}')">Adjust</button>${isM()?` <button class="b sm d" onclick="A.del('${p.id}')">Del</button>`:''}`]),'No products. Add one or import a CSV.')}</div><div class=card><b>Stock valuation:</b> ${F(D.products.reduce((a,p)=>a+p.stock*p.cost,0))} at cost · ${F(D.products.reduce((a,p)=>a+p.stock*p.price,0))} at selling price</div>`};
V.pos=()=>`<div class=pos><div><div class=card><div class=row style="flex-wrap:nowrap"><input id=sq placeholder="Scan barcode, or search name / SKU  (F2)" autocomplete=off><button class=b onclick="scan(posAdd)">Camera</button></div><div class=pg id=pgrid></div></div></div><div><div class=card><div class=row style="justify-content:space-between"><b>Cart</b><span><button class="b sm" onclick="A.hold()">Hold</button> <button class="b sm" onclick="A.held()">Held (${D.held.length})</button> <button class="b sm d" onclick="cart=[];go()">Clear</button></span></div><div id=cl></div><div class=grid style="grid-template-columns:1fr 1fr"><label>Customer<select id=cu onchange="cu=this.value;calcUI()"><option value="">Walk-in</option>${D.customers.map(c=>`<option value=${c.id} ${c.id==cu?'selected':''}>${E(c.name)}</option>`).join('')}</select></label><label>Bill discount<div style="display:flex;gap:4px"><input type=number id=cdv value=${cd.v} oninput="cd.v=+this.value||0;calcUI()"><select style="width:62px" onchange="cd.t=this.value;calcUI()"><option ${cd.t=='%'?'selected':''}>%</option><option ${cd.t=='₹'?'selected':''}>₹</option></select></div></label></div><div id=ct></div><button class="b p" style="width:100%;padding:13px;margin-top:8px" onclick="A.pay()">Checkout (F9)</button></div></div></div>`;
V.pur=()=>`<div class=top><h2>Purchases</h2><button class="b p" onclick="A.pur()">New purchase</button></div><div class=card>${tb(['Invoice','Date','Supplier','Total','Paid','Due'],D.purchases.map(p=>[E(p.no),dt(p.date),E(supN(p.sup)),F(p.total),F(p.paid),F(p.total-p.paid)]),'No purchases yet.')}</div>`;

// POS logic
function calc(){const sub=cart.reduce((a,l)=>a+l.price*l.qty-l.d,0),cdv=Math.min(sub,cd.t=='%'?sub*cd.v/100:cd.v),c=D.customers.find(x=>x.id==cu),ig=c&&c.state&&D.set.state&&c.state!=D.set.state;let tax=0,tot=0;
const items=cart.map(l=>{const g=l.price*l.qty-l.d,n=sub?g-cdv*g/sub:0,tx=D.set.incl?n/(1+l.gst/100):n,t=r2(n-(D.set.incl?tx:n)+(D.set.incl?0:n*l.gst/100));const taxable=r2(D.set.incl?tx:n),tt=D.set.incl?r2(n-tx):r2(n*l.gst/100);tax+=tt;tot+=taxable+tt;return{pid:l.pid,name:l.name,hsn:l.hsn,gst:l.gst,qty:l.qty,price:l.price,cost:l.cost,taxable,tax:tt,tot:r2(taxable+tt),rq:0}});
return{items,sub:r2(sub),disc:r2(cdv+cart.reduce((a,l)=>a+l.d,0)),tax:r2(tax),total:Math.round(tot*100)/100,ig,cust:c}}
function calcUI(){$('#cl').innerHTML=cart.length?cart.map((l,i)=>`<div class=ln><div style="flex:1"><b>${E(l.name)}</b><br><small>${F(l.price)} · GST ${l.gst}%</small></div><button class="b sm" onclick="qt(${i},-1)">−</button><b>${l.qty}</b><button class="b sm" onclick="qt(${i},1)">+</button><input type=number placeholder="disc ₹" title="Item discount ₹" value="${l.d||''}" onchange="cart[${i}].d=Math.max(0,+this.value||0);calcUI()"><button class="b sm d" onclick="cart.splice(${i},1);calcUI()">×</button></div>`).join(''):'<div class=emp>Scan or tap a product to start.</div>';
const c=calc();$('#ct').innerHTML=`<table><tr><td>Subtotal</td><td align=right>${F(c.sub)}</td></tr><tr><td>Discount</td><td align=right>−${F(c.disc)}</td></tr><tr><td>GST (${c.ig?'IGST':'CGST+SGST'})</td><td align=right>${F(c.tax)}</td></tr><tr><td><b>Total</b></td><td align=right class=tot>${F(c.total)}</td></tr></table>`}
const qt=(i,d)=>{const l=cart[i],p=D.products.find(x=>x.id==l.pid);if(d>0&&p&&l.qty+1>p.stock)return T('Only '+p.stock+' in stock',1);l.qty+=d;if(l.qty<1)cart.splice(i,1);calcUI()};
function posAdd(code){const c=String(code).trim();if(!c)return;const p=D.products.find(x=>x.bc==c||(x.bc2||'').split(',').includes(c)||x.sku.toLowerCase()==c.toLowerCase());if(!p){T('Unknown product: '+c,1);return}addP(p)}
function addP(p){const l=cart.find(x=>x.pid==p.id);if((l?l.qty:0)+1>p.stock)return T(p.name+': out of stock',1);beep();l?l.qty++:cart.push({pid:p.id,name:p.name,price:p.price,qty:1,gst:p.gst,hsn:p.hsn,cost:p.cost,d:0});calcUI()}
function posInit(){const s=$('#sq'),g=()=>{const v=s.value.toLowerCase();$('#pgrid').innerHTML=D.products.filter(p=>!v||(p.name+p.sku+p.bc).toLowerCase().includes(v)).slice(0,60).map(p=>`<button class=pr onclick="addP(D.products.find(x=>x.id=='${p.id}'))"><b>${E(p.name)}</b><br>${F(p.price)}<br><small>${p.stock} left</small></button>`).join('')||'<div class=emp>No match. Add it in Inventory.</div>'};g();s.oninput=g;s.onkeydown=e=>{if(e.key=='Enter'){const v=s.value.trim(),ex=D.products.find(x=>x.bc==v||x.sku.toLowerCase()==v.toLowerCase());if(ex||/^\d{6,}$/.test(v)){posAdd(v)}else{const m=D.products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase()));m.length==1?addP(m[0]):m.length||T('Unknown product',1)}s.value='';g()}};s.focus();calcUI()}

q.forEach((x,k)=>{if(x){s.items[k].rq+=x;mv(D.products.find(p=>p.id==s.items[k].pid),x,'Return '+s.no)}});amt=r2(amt);s.refunded=r2(s.refunded+amt);const c=D.customers.find(x=>x.id==s.cust);if(c&&m.querySelector('#rm').value=='store credit')c.due=r2(c.due-amt);log('Return '+s.no+' '+amt);save();m.remove();go();T('Refund '+F(amt))}},
share(id,em){const s=D.sales.find(x=>x.id==id),t=`${D.set.name} - Invoice ${s.no}\nTotal: ${F(s.total)}\nThank you!`;em?location.href='mailto:?subject='+encodeURIComponent('Invoice '+s.no)+'&body='+encodeURIComponent(t):open('https://wa.me/?text='+encodeURIComponent(t))},
cancel(id){CONF('Cancel this invoice? Stock will be restored.',()=>{const s=D.sales.find(x=>x.id==id);s.items.forEach(i=>mv(D.products.find(p=>p.id==i.pid),i.qty-i.rq,'Cancel '+s.no));const c=D.customers.find(x=>x.id==s.cust);if(c)c.due=r2(c.due-s.bal);s.status='cancelled';log('Cancelled '+s.no);save();go()})},
pur(){const m=M(`<h3>New purchase</h3><div class=grid><label>Supplier<select id=ps>${D.suppliers.map(s=>`<option value=${s.id}>${E(s.name)}</option>`).join('')}</select></label><label>Bill no.<input id=pn></label><label>Shipping/other<input id=po type=number value=0></label><label>Paid now<input id=pp type=number value=0></label></div><div id=pl></div><div class=row style="justify-content:flex-start"><select id=pa style="max-width:240px"><option value="">Add product…</option>${D.products.map(p=>`<option value=${p.id}>${E(p.name)}</option>`).join('')}</select><button class=b id=pcam>Scan</button></div><div id=pt style="margin:10px 0"></div><div class=row><button class="b p" id=pk>Confirm purchase</button></div>`,640);
if(!D.suppliers.length){m.remove();return T('Add a supplier first',1)}
let it=[];const draw=()=>{m.querySelector('#pl').innerHTML=it.map((l,i)=>`<div class=ln><div style="flex:1">${E(l.n)}</div>qty<input type=number value=${l.q} onchange="this.dispatchEvent(new Event('x'))" data-i=${i} data-f=q> cost<input type=number value=${l.c} data-i=${i} data-f=c> GST%<input type=number value=${l.g} data-i=${i} data-f=g></div>`).join('');m.querySelectorAll('#pl input').forEach(x=>x.onchange=()=>{it[x.dataset.i][x.dataset.f]=+x.value||0;draw()});m.querySelector('#pt').innerHTML='Total: <b>'+F(tot())+'</b>'};
const tot=()=>r2(it.reduce((a,l)=>a+l.q*l.c*(1+l.g/100),0)+(+m.querySelector('#po').value||0)),add=p=>{if(!p)return;const l=it.find(x=>x.id==p.id);l?l.q++:it.push({id:p.id,n:p.name,q:1,c:p.cost,g:p.gst});draw()};
m.querySelector('#pa').onchange=e=>{add(D.products.find(p=>p.id==e.target.value));e.target.value=''};m.querySelector('#po').oninput=draw;m.querySelector('#pcam').onclick=()=>scan(c=>{const p=D.products.find(x=>x.bc==c);p?add(p):T('Unknown barcode — add the product first',1)});
m.querySelector('#pk').onclick=()=>{if(!it.length||it.some(l=>l.q<=0))return T('Add items with quantity',1);const t=tot(),pd=Math.min(t,+m.querySelector('#pp').value||0),sid=m.querySelector('#ps').value;
it.forEach(l=>{const p=D.products.find(x=>x.id==l.id);p.cost=l.c;mv(p,l.q,'Purchase')});const s=D.suppliers.find(x=>x.id==sid);s.due=r2(s.due+t-pd);D.purchases.unshift({id:uid(),no:m.querySelector('#pn').value||'PUR-'+(D.purchases.length+1),date:now(),sup:sid,items:it,total:t,paid:pd});log('Purchase '+t);save();m.remove();go();T('Stock updated')};draw()},
party(k,id){const o=D[k].find(x=>x.id==id)||{};FORM(id?'Edit':'Add',[['name','Name'],['phone','Mobile'],['email','Email','email'],['gstin','GSTIN'],['state','State code'],['addr','Address'],...(k=='customers'?[['limit','Credit limit (0 = none)','number']]:[])],n=>{if(!n.name)return T('Name required',1)&&false;if(n.gstin&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(n.gstin.toUpperCase()))return T('Invalid GSTIN format',1)&&false;n.gstin=n.gstin.toUpperCase();id?Object.assign(o,n):D[k].push({id:uid(),due:0,...n})},o)},
pdel(k,id){CONF('Delete?',()=>{D[k]=D[k].filter(x=>x.id!=id);save();go()})},
settle(k,id){const o=D[k].find(x=>x.id==id);FORM((k=='customers'?'Receive from ':'Pay ')+E(o.name)+' (due '+F(o.due)+')',[['a','Amount','number']],n=>{if(n.a<=0||n.a>o.due)return T('Enter an amount up to the due balance',1)&&false;o.due=r2(o.due-n.a);log('Settle '+o.name+' '+n.a)})},
exp1(){FORM('Add expense',[['cat','Category'],['amt','Amount','number'],['pm','Method','select',['cash','upi','card','bank']],['note','Note']],o=>{if(o.amt<=0||!o.cat)return T('Category and amount required',1)&&false;D.expenses.unshift({...o,date:now()})})},
expSales(){dl('sales.csv',csv([['invoice','date','customer','total','tax','status'],...live(rp).map(s=>[s.no,s.date,s.cn||'Walk-in',s.total,s.tax,s.status])]))},
gstr(){dl('gstr1.csv',csv([['invoice','date','hsn','gst%','taxable','tax','type'],...live(rp).flatMap(s=>s.items.map(i=>[s.no,s.date.slice(0,10),i.hsn,i.gst,i.taxable,i.tax,s.ig?'IGST':'CGST+SGST']))]))},
sset(){const s=D.set;['name','gstin','phone','addr','state','upi','foot'].forEach(k=>s[k]=$('#s_'+k).value.trim());s.incl=$('#s_incl').value=='1';s.accent=$('#s_accent').value;document.documentElement.style.setProperty('--a',s.accent);save();T('Settings saved')},
user(){FORM('Add user',[['name','Name'],['role','Role','select',['cashier','manager','admin']],['pin','PIN (4+ digits)','password']],o=>{if(!o.name||o.pin.length<4)return T('Name and 4+ digit PIN required',1)&&false;sha(o.pin).then(h=>{D.users.push({id:uid(),name:o.name,role:o.role,h});save();go()})})},
pin(id){FORM('Reset PIN',[['pin','New PIN','password']],o=>{if(o.pin.length<4)return T('4+ digits',1)&&false;sha(o.pin).then(h=>{D.users.find(x=>x.id==id).h=h;save();T('PIN updated')})})},
udel(id){CONF('Delete user?',()=>{D.users=D.users.filter(x=>x.id!=id);save();go()})},
restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.products||!d.users)throw 0;CONF('Replace ALL current data with this backup?',()=>{localStorage.setItem('tgr',JSON.stringify(d));location.reload()})}catch(e){T('Not a valid backup file',1)}};i.click()}};
function mv(p,q,r){p.stock+=q;D.moves.unshift({t:now(),n:p.name,q,r});D.moves=D.moves.slice(0,500)}
boot();
</script></body></html>
